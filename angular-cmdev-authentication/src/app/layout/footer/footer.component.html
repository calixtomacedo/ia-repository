<footer class="bg-white border-top py-4 mt-auto">
  <div class="container-fluid px-lg-4">
    <div class="row align-items-center gy-3">
      <!-- Col 1: Project Info -->
      <div class="col-md-6 text-center text-md-start">
        <div class="fw-semibold text-dark">
          <i class="bi bi-shield-check text-primary me-1"></i>
          sboot-cmdev-atom-authentication &bull; Frontend Angular
        </div>
        <div class="text-muted small mt-1">
          Spring Boot 4.1.1 &bull; Java 25 &bull; JDBI 3 &bull; MySQL &bull; Angular 19
        </div>
      </div>

      <!-- Col 2: API Connection Config & Test -->
      <div class="col-md-6 text-center text-md-end">
        <div class="d-inline-flex flex-wrap align-items-center justify-content-center justify-content-md-end gap-2">
          <button class="btn btn-sm btn-outline-secondary" (click)="testHealth()" title="Verificar conectividade com a API">
            <i class="bi bi-activity text-success me-1"></i> Testar Conexão
          </button>

          <button class="btn btn-sm btn-outline-primary" (click)="toggleEditUrl()" title="Configurar URL do Backend">
            <i class="bi bi-gear-fill me-1"></i> Configurar API
          </button>
        </div>

        @if (isEditingUrl) {
          <div class="mt-2 d-flex justify-content-end">
            <div class="card p-2 shadow-sm text-start" style="max-width: 400px; width: 100%;">
              <label class="form-label small fw-bold mb-1">URL Base da API Backend:</label>
              <div class="input-group input-group-sm mb-2">
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="customUrl"
                  placeholder="Ex: http://localhost:8080/api"
                />
              </div>
              <div class="d-flex justify-content-end gap-2">
                <button class="btn btn-sm btn-outline-secondary" (click)="resetUrl()">Restaurar Padrão</button>
                <button class="btn btn-sm btn-primary" (click)="saveUrl()">Salvar</button>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</footer>
